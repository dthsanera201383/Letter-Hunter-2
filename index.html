<HTML>
 <!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Letter Hunter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>:root{--f:Fredoka,system-ui,sans-serif}

:root{--ink:#1b1d3a;--pan:rgba(255,255,255,.95);--ac:#ffb703;--ac2:#3a86ff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--pan:rgba(27,29,58,.95);--ink:#fff}}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;margin:0;background:#1b1d3a;font-family:var(--f);overflow:hidden;color:var(--ink)}
#cv{position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;left:0;right:0;pointer-events:none;padding:0 8px}
.b{pointer-events:auto;border:0;border-radius:14px;padding:9px 13px;font:700 16px var(--f);background:var(--ac);color:#1b1d3a;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.b.s{background:var(--ac2);color:#fff}.b.r{background:#e63946;color:#fff}
.pan{pointer-events:auto;position:fixed;left:10px;right:10px;bottom:10px;max-height:72%;overflow:auto;background:var(--pan);border-radius:18px;padding:14px;touch-action:pan-y;z-index:5}
.pan *{touch-action:pan-y}
#top{top:calc(6px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
#stat{color:#fff;font-weight:700;text-shadow:0 2px 0 #000;background:rgba(0,0,0,.35);padding:6px 10px;border-radius:12px}

#pb{position:fixed;left:8px;top:calc(52px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
#m{top:calc(54px + env(safe-area-inset-top,0px));text-align:center;color:#fff;text-shadow:0 2px 0 #000}
#word{font-size:34px;letter-spacing:3px;font-weight:700;min-height:42px}
#hearts{font-size:15px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#opp{font-size:15px;min-height:20px}
#joy{position:fixed;left:22px;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.6)}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:var(--ac)}
#act{position:fixed;right:18px;bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}

.lt{margin:4px;font-size:28px;width:58px;height:58px}
#cd{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:700;color:#fff;text-shadow:0 6px 0 #000;pointer-events:none}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;text-align:center;max-width:90%;pointer-events:none;z-index:9}
[hidden]{display:none!important}
select{font:inherit;padding:6px;border-radius:8px}
.it{display:flex;justify-content:space-between;align-items:center;padding:6px 0;gap:8px}
.tabs,.grid{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sw{width:58px;height:70px;border-radius:14px;border:3px solid transparent;background:rgba(127,127,127,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 12px var(--f);color:var(--ink);gap:3px}
.sw.on{border-color:var(--ac)}.sw.q{opacity:.45}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px}
#pv{float:right;margin-left:8px}
#stat{display:flex;align-items:center;gap:8px;pointer-events:auto;line-height:1.25;font-size:15px}
#bar{overflow-x:auto;max-width:60vw}
.tabs{flex-wrap:nowrap!important;overflow-x:auto;padding-bottom:4px}.tabs .b{flex:0 0 auto;padding:7px 11px}
.sw span{font-size:11px}.ava2{font-size:32px;line-height:1}
.fr{width:var(--s);height:var(--s);border-radius:50%;padding:max(3px,calc(var(--s)*.08));display:inline-flex;flex:0 0 auto;background:#fff}
.ava{flex:1;border-radius:50%;background:#e8eefc;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.5);line-height:1}
.fr1{background:#7ee8c7}.fr2{background:#ff8fab}.fr3{background:#4cc9f0}.fr4{background:linear-gradient(135deg,#ff9a3c,#ff3d7f)}
.fr5{background:linear-gradient(135deg,#fff3b0,#ffb703,#a86a00)}.fr6{background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red)}
.fr7{background:#101040;box-shadow:0 0 8px #3a86ff,0 0 18px #3a86ff}.fr8{background:linear-gradient(#ffe600,#ff4d00,#a00000);box-shadow:0 0 10px #ff4d00}
.fr9{background:conic-gradient(#1b0b4a,#8a2be2,#00d4ff,#1b0b4a);box-shadow:0 0 12px #8a2be2}.fr10{background:conic-gradient(#fff,#8ee8ff,#fff,#8ee8ff,#fff);box-shadow:0 0 12px #8ee8ff}
.fr11{background:conic-gradient(#ff0040,#ffd700,#ff0040,#ffd700,#ff0040);box-shadow:0 0 14px #ffd700,0 0 26px #ff0040}
.tx,input,textarea{-webkit-user-select:text;user-select:text}
.tx{width:100%;font:600 16px var(--f);padding:8px;border-radius:10px;border:2px solid var(--ac);margin:4px 0}
.stats{display:flex;gap:12px;flex-wrap:wrap;font-weight:700;margin:6px 0}
#pv{float:right;margin-left:8px}
#res,#rules{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(10,10,30,.62);padding:14px}
.rbox{position:relative;text-align:center;border-radius:26px;padding:26px 22px;min-width:270px;max-width:92vw;color:#fff;box-shadow:0 14px 50px rgba(0,0,0,.6);animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
#res.win .rbox{background:linear-gradient(160deg,#ffd23f,#ff9f1c 55%,#e63946);border:6px solid #fff3b0}
#res.lose .rbox{background:linear-gradient(160deg,#5b6b8c,#2b3350);border:6px solid #8c97b3}
#rt{font-size:clamp(40px,12vw,64px);font-weight:700;letter-spacing:2px;text-shadow:0 5px 0 rgba(0,0,0,.35);margin-bottom:8px}

#rs{font-size:17px;line-height:1.6;margin-bottom:14px}#rs .sm{opacity:.85;font-size:14px}
#conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bounce{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.08) rotate(2deg)}}
.rcard{position:relative;background:var(--pan);border-radius:24px;padding:20px 18px 14px;max-width:420px;width:100%;max-height:92vh;overflow:auto;touch-action:pan-y;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
#rx{position:absolute;right:10px;top:10px;padding:5px 11px}
#rbody h2{margin:2px 0 0;font-size:28px}.rsub{font-weight:700;opacity:.7;margin-bottom:8px}
#rbody ul{padding-left:0;list-style:none;margin:8px 0}#rbody li{padding:7px 10px;margin:5px 0;border-radius:12px;background:rgba(127,127,127,.15);font-size:15px;line-height:1.35}
.rex{text-align:center;font-weight:700;background:var(--ac);color:#1b1d3a;border-radius:12px;padding:8px;font-size:14px}
#rdots{display:flex;gap:7px;justify-content:center;margin:12px 0 8px}#rdots i{width:10px;height:10px;border-radius:50%;background:rgba(127,127,127,.4)}#rdots i.on{background:var(--ac2)}
.rnav{display:flex;justify-content:space-between}
#cl{position:fixed;right:8px;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#cl .b{padding:6px 10px;font-size:14px}#clc{pointer-events:auto;position:relative;background:var(--pan);border-radius:16px;padding:12px 12px 8px;width:min(300px,86vw);max-height:46vh;overflow:auto;font-size:13px;touch-action:pan-y}
#clc ul{margin:2px 0 8px;padding-left:18px}#clc li{margin:3px 0}#clx{position:absolute;right:6px;top:6px;padding:2px 8px!important}
.pulse{animation:pls 1.2s infinite}@keyframes pls{50%{box-shadow:0 0 0 7px rgba(58,134,255,.35)}}

.tc{color:#eef1f6;-webkit-text-stroke:.7px #7d8797;text-shadow:0 1px 2px rgba(0,0,0,.35)}.tu{color:#2fb34a}.tr{color:#2e7bff}.tm{color:#a020c8;text-shadow:0 0 8px rgba(160,32,200,.35)}
.tlr{color:#e63946;text-shadow:0 0 8px rgba(230,57,70,.5)}.tlg{color:#ffb800;text-shadow:0 0 8px rgba(255,184,0,.6)}
.ts{font-weight:700;background:linear-gradient(100deg,#000 0%,#000 38%,#c9cfe6 50%,#000 62%,#000 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:.5px rgba(255,255,255,.6);animation:glint 2.4s linear infinite}
.spk{color:#fff;text-shadow:0 0 6px #fff,0 0 12px #9ab;animation:twk 1.1s ease-in-out infinite;margin-left:3px;display:inline-block}
@keyframes glint{from{background-position:130% 0}to{background-position:-130% 0}}@keyframes twk{50%{opacity:.25;transform:scale(.6)}}
.tier{display:flex;align-items:center;gap:6px;font-size:16px}.pkind{display:inline-block;margin:6px 0;padding:2px 10px;border-radius:99px;font-weight:700;font-size:13px;color:#fff}.pkind.k0{background:#2fb34a}.pkind.k1{background:#d6336c}.pkind.k2{background:linear-gradient(90deg,#ffb703,#e63946)}.pfx{font-weight:700;margin:2px 0}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:6px 0}
.acard{position:relative;border-radius:16px;padding:10px 6px;text-align:center;color:#fff;background:linear-gradient(135deg,#2b2160,#6a2c9a);border:3px solid transparent;display:flex;flex-direction:column;gap:3px;align-items:center;overflow:hidden}
.acard::before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.25),transparent 30%);animation:spin 3s linear infinite}
.acard>*{position:relative}.aem{font-size:34px;filter:drop-shadow(0 0 8px rgba(255,255,255,.7))}.acard span{font-size:12px}.acard.on{border-color:var(--ac);box-shadow:0 0 14px var(--ac)}
@keyframes spin{to{transform:rotate(360deg)}}
.board{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.bprev{flex:0 0 auto;width:min(100%,230px);text-align:center;margin:0 auto}.bside{flex:1 1 250px;min-width:0}
.bframe{border-radius:20px;padding:5px;background:linear-gradient(135deg,#ffd23f,#ff8fab,#4cc9f0);display:inline-block;box-shadow:0 6px 20px rgba(0,0,0,.25)}.bframe #pv{float:none;margin:0;display:block;line-height:0}.bframe canvas{max-width:100%;height:auto}
.bname{font-size:20px;font-weight:700;margin-top:8px}.bsub{opacity:.8;font-size:13px;margin:2px 0 8px}.bbtns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.bcoin{font-weight:700;margin-bottom:6px}
.pf-hero{text-align:center;padding:14px 10px 10px;border-radius:20px;margin-bottom:8px;background:radial-gradient(circle at 50% 0,rgba(255,200,60,.4),transparent 62%),linear-gradient(160deg,rgba(90,60,210,.28),rgba(255,90,160,.2))}
.pf-ava .fr{box-shadow:0 0 0 4px rgba(255,255,255,.35),0 0 26px rgba(255,200,60,.65)}.pf-name{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.pn{font-size:clamp(28px,9vw,40px);font-weight:700;letter-spacing:1px;background:linear-gradient(90deg,#ff5fa2,#ffb703,#3aa7ff,#9b5de5,#ff5fa2);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 4s linear infinite;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
@keyframes shine{to{background-position:250% 0}}
.gs{font-size:clamp(22px,7vw,30px);font-weight:700;line-height:1;display:inline-block}.gm{color:#35b6ff;text-shadow:0 0 8px rgba(53,182,255,.6)}.gf{color:#ff5fa2;text-shadow:0 0 8px rgba(255,95,162,.6)}.gq{color:#9aa5b1;border:2px dashed #9aa5b1;border-radius:8px;padding:0 6px;font-size:.8em}
#stat .gs{font-size:16px}.lbr .gs,.pn2 .gs,.mr-nm .gs{font-size:15px}
.pf-rank{display:inline-block;margin:4px 0;padding:3px 14px;border-radius:99px;background:linear-gradient(90deg,#ffb703,#ff8fab);color:#1b1d3a;font-weight:700}
.pf-bio{font-style:italic;opacity:.9;margin:4px 6px}.pf-stats{display:flex;gap:8px;justify-content:center;margin-top:8px}.pf-stats span{flex:1;background:rgba(127,127,127,.18);border-radius:12px;padding:6px 4px;display:flex;flex-direction:column}.pf-stats small{opacity:.7;font-size:11px}
.gbtns{display:flex;gap:6px}.gb{width:44px;height:44px;border-radius:12px;border:3px solid transparent;background:rgba(127,127,127,.2);display:flex;align-items:center;justify-content:center;padding:0}.gb.on{border-color:var(--ac);background:rgba(255,255,255,.25)}
.lbframe{border:4px solid transparent;border-radius:20px;padding:10px;background:linear-gradient(var(--pan),var(--pan)) padding-box,linear-gradient(135deg,#ffd23f,#ff5fa2,#3aa7ff,#ffd23f) border-box;position:relative}
.lbtitle{text-align:center;font-size:24px;font-weight:700;letter-spacing:2px;background:linear-gradient(90deg,#ffb703,#ff5fa2,#9b5de5);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:10px 0 8px}
.pcol{position:relative;flex:1;max-width:120px;text-align:center;border-radius:16px 16px 6px 6px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#1b1d3a;overflow:hidden}
.pcol::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);animation:sheen 2.6s linear infinite}
.p1{min-height:176px;background:linear-gradient(#fff0a0,#ffb703);box-shadow:0 0 24px rgba(255,200,0,.85);animation:glow 1.4s ease-in-out infinite alternate}.p2{min-height:150px;background:linear-gradient(#fafcff,#aab6c6);box-shadow:0 0 14px rgba(190,205,225,.7)}.p3{min-height:130px;background:linear-gradient(#ffd2a6,#c0763a);box-shadow:0 0 14px rgba(205,127,50,.6)}
.pcol.mine{outline:3px solid #ff2d75;outline-offset:2px}.pn2{font-weight:700;font-size:13px;word-break:break-all}.pv2{font-size:12px;display:flex;flex-direction:column}.pm{font-size:24px}.crown{font-size:26px;animation:floaty 1.2s ease-in-out infinite alternate}
@keyframes sheen{to{left:140%}}@keyframes glow{to{box-shadow:0 0 38px rgba(255,210,0,1)}}@keyframes floaty{to{transform:translateY(-5px) rotate(6deg)}}
.lbr{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:12px;margin:3px 0;background:rgba(127,127,127,.13)}.lbr .no{width:26px;font-weight:700;text-align:center;opacity:.75}.lbr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.lbr .vl{font-size:13px;display:flex;flex-direction:column;text-align:right}
.lbr.mine{background:linear-gradient(90deg,rgba(255,45,117,.35),rgba(255,183,3,.3));outline:2px solid #ff2d75}.lbnote{display:block;text-align:center;opacity:.6;margin:6px 0}
.myrank{position:sticky;bottom:-12px;display:flex;align-items:center;gap:10px;margin:8px -2px -4px;padding:10px 12px;border-radius:16px;color:#fff;background:linear-gradient(100deg,#ff2d75,#ff8a00,#ffd23f);box-shadow:0 -6px 18px rgba(0,0,0,.3),0 0 20px rgba(255,45,117,.7);animation:mypulse 1.6s ease-in-out infinite alternate}
.mr-no{font-size:30px;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.35);min-width:60px;text-align:center}.mr-nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}.mr-nm b{font-size:17px;text-shadow:0 1px 0 rgba(0,0,0,.3)}.mr-nm small{opacity:.9}.mr-vl{display:flex;flex-direction:column;text-align:right;font-size:13px}.mr-vl b{font-size:15px}
@keyframes mypulse{to{box-shadow:0 -6px 18px rgba(0,0,0,.3),0 0 32px rgba(255,200,0,.95)}}
.wheelw{position:relative;width:min(300px,76vw);margin:8px auto}.wheelw canvas{width:100%;height:auto;display:block;border-radius:50%;box-shadow:0 0 0 8px #ffd23f,0 0 0 12px #fff,0 8px 26px rgba(0,0,0,.4);touch-action:none}
.wptr{position:absolute;left:50%;top:-16px;margin-left:-14px;border:14px solid transparent;border-top:26px solid #e63946;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.wrates{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;margin:8px 0}.wrates div{display:flex;justify-content:space-between;gap:6px}
.wres{min-height:10px}.wcard{text-align:center;border-radius:16px;padding:10px;background:rgba(127,127,127,.18);animation:pop .5s}.wcard .wi{font-size:44px;display:block}.wcard b{font-size:20px;display:block}
.pclose{position:sticky;top:0;float:right;z-index:3;padding:3px 10px;margin:-6px -6px 4px 6px}
#opp{min-height:30px}.obig{font-weight:700;letter-spacing:1px;color:#ffe27a;text-shadow:0 3px 0 #000,0 0 14px rgba(255,200,0,.55);line-height:1.05;white-space:nowrap}#opp small{font-size:14px}
#top{flex-wrap:wrap}.seat #bar,.seat #cl{display:none}
@media (orientation:portrait),(max-width:560px){#top{gap:6px}#stat{flex:1 1 auto;min-width:0}#bar{order:3;width:100%;max-width:none;justify-content:space-between;overflow:visible}#bar .b{flex:1 1 0;padding:9px 0;font-size:18px}#cl{top:calc(112px + env(safe-area-inset-top,0px))}#word{font-size:clamp(24px,8.5vw,42px)}#joy{width:112px;height:112px}#knob{left:31px;top:31px}.pcol{max-width:100px}}
@media (orientation:landscape) and (min-width:700px){.pan{left:auto;right:10px;top:10px;bottom:10px;width:min(560px,58vw);max-height:none}}
@media (orientation:landscape) and (max-height:480px){#stat small{display:none}#joy{width:100px;height:100px}}

.tlg{font-weight:700;background:linear-gradient(100deg,#b8860b 0%,#ffd23f 30%,#fff3b0 50%,#ffd23f 70%,#b8860b 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gflow 3.2s linear infinite;filter:drop-shadow(0 0 4px rgba(255,200,40,.85)) drop-shadow(0 0 9px rgba(255,170,0,.45))}
@keyframes gflow{from{background-position:120% 0}to{background-position:-120% 0}}
#pv{float:none!important;display:flex;justify-content:center;margin:8px auto!important}.pvwrap{display:flex;justify-content:center}.bframe #pv{margin:0!important}
.invr{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:rgba(127,127,127,.15);margin:6px 0}.inv-ic{font-size:30px;width:40px;text-align:center}.inv-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}.inv-tx small{opacity:.75}.empty{text-align:center;opacity:.7;padding:16px}

.clrow{display:flex;gap:6px}#aur{background:linear-gradient(90deg,#ff5fa2,#ffb703,#3aa7ff);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}button:disabled{opacity:.45}
input[type=range]{width:55%;touch-action:pan-y}
#home{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;background:radial-gradient(ellipse at 50% 38%,rgba(255,214,102,.30),transparent 58%),linear-gradient(180deg,rgba(8,6,36,.82),rgba(14,10,52,.5) 45%,rgba(8,6,36,.9));overflow:hidden}
.hcenter{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.5vh,22px)}

function musicTick(){if(!AC||!musOn||AC.state!='running')return;const mm=musicMode=='match',sp=60/(mm?84:104)/2,vol=mm?.6:1;
 while(nextT<AC.currentTime+.9){const bar=Math.floor(stepI/8)%4,beat=stepI%8,r=ROOT[bar],ch=CHT[bar],t0=nextT;
  if(beat==0)ch.forEach(x=>mnote(mf(r+x),t0,sp*7.5,'sine',.06*vol));
  if(beat==0||beat==4)mnote(mf(r-12),t0,sp*1.9,'triangle',.13*vol);
  const ai=[0,1,2,1,2,1,2,1][beat];mnote(mf(r+[0,ch[1],ch[2],12][ai==0?0:ai==1?1:2]+12),t0,sp*1.3,'triangle',.045*vol);
  if(!mm&&beat%2==0&&Math.random()<.5)mnote(mf(PENT[Math.floor(Math.random()*PENT.length)]+(r>5?0:12)),t0,sp*1.7,'sine',.055);
  nextT+=sp;stepI++}}
function musicStart(){if(!ensureAudio())return;musOn=true;nextT=AC.currentTime+.15;stepI=0;if(!musTimer)musTimer=setInterval(musicTick,200)}
function setMusicMode(m){musicMode=m}
['pointerdown','touchend','keydown'].forEach(ev=>addEventListener(ev,()=>{ensureAudio()},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume()});
// ===== v9: diamonds + achievements =====
function noGems(n){sfx(6);notify('💎 '+t('noGems'),t('noGemsD').replace('{n}',Math.max(0,n-(sv.gems||0))),'bad')}
window.noGems=noGems;
function gemsPanel(){panel(`<div class="gemhd"><span class="gembig">💎</span><h3>${t('exch')}</h3></div><div class="gemrow"><div class="gemcost"><b>25,000 🪙</b><small>${t('have')}: ${sv.coins.toLocaleString()}</small></div><span>+</span><div class="gemcost"><b>10 🔥</b><small>${t('have')}: ${sv.streak}</small></div><span>→</span><div class="gemcost gg"><b>1 💎</b><small>${t('have')}: ${sv.gems||0}</small></div></div><p>${t('exchNote')}</p><button class="b big" onclick="exchange()">💎 ${t('exchBtn')}</button>`)}
window.exchange=()=>{if(sv.coins<25000)return noCoins(25000);if(sv.streak<10){sfx(6);return notify('🔥 '+t('needStreak'),t('needStreakD'),'bad')}sv.best=Math.max(sv.best||0,sv.streak);sv.coins-=25000;sv.streak-=10;sv.gems=(sv.gems||0)+1;save();ui();sfx(4);notify('💎 '+t('gemGot'),t('gemGotD'),'gift');gemsPanel()};
function achPanel(){sv.maxCoins=Math.max(sv.maxCoins||0,sv.coins);panel(`<div class="achhd">🏅 ${t('ach')}</div><div class="achgrid"><div class="achc a1"><span>🔥</span><b>${sv.best||0}</b><small>${t('achStreak')}</small></div><div class="achc a2"><span>🎮</span><b>${sv.played||0}</b><small>${t('achGames')}</small></div><div class="achc a3"><span>🪙</span><b>${(sv.maxCoins||0).toLocaleString()}</b><small>${t('achCoins')}</small></div><div class="achc a4"><span>📝</span><b>${(sv.words||0).toLocaleString()}</b><small>${t12('achWords')}</small></div></div>`)}
$('dia').onclick=gemsPanel;$('ach').onclick=achPanel;

// ===== v10: in-game keyboard, jump-off, turn sound =====
const KROWS=['qwertyuiop','asdfghjkl','zxcvbnm'];
function kbActive(){const m=sv.kb||'auto';return m=='in'||(m=='auto'&&window.matchMedia&&matchMedia('(pointer:coarse)').matches)}
function buildKb(){const k=$('kb');k.innerHTML=KROWS.map((r,ri)=>`<div class="kr">${[...r].map(c=>`<button class="kk" data-k="${c}">${c.toUpperCase()}</button>`).join('')}${ri==2?'<button class="kk kw" data-k="⌫">⌫</button>':''}</div>`).join('');
 k.onpointerdown=ev=>{const b=ev.target.closest&&ev.target.closest('.kk');if(!b)return;ev.preventDefault();kbKey(b.dataset.k)}}
function kbKey(c){if(!G||G.done||G.phase!='play'||!G.pl[G.pi].human)return;const inp=$('in');if(c=='⌫')inp.value=inp.value.slice(0,-1);else if(G.zone=='k')inp.value=c;else if(inp.value.length<30)inp.value+=c}
function showKb(on){const k=$('kb');if(on){if(!k.dataset.b){buildKb();k.dataset.b='1'}k.hidden=false;document.body.classList.add('kbon');document.documentElement.style.setProperty('--kbh',(k.offsetHeight||150)+'px')}else{k.hidden=true;document.body.classList.remove('kbon')}}
addEventListener('resize',()=>{const k=$('kb');if(k&&!k.hidden)document.documentElement.style.setProperty('--kbh',(k.offsetHeight||150)+'px')});
if(window.visualViewport){const vv=window.visualViewport,upd=()=>{const ins=FL.on?0:Math.max(0,innerHeight-vv.height-vv.offsetTop);document.documentElement.style.setProperty('--kbi',ins+'px')};vv.addEventListener('resize',upd);vv.addEventListener('scroll',upd)}
function sfxTurn(){if(!sv.snd||sv.vol===0)return;if(!ensureAudio())return;try{const t0=AC.currentTime+.02;
 [[659,0],[880,.07],[1175,.14],[1568,.22]].forEach(([f,d])=>{const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o.type='sine';o2.type='triangle';o.frequency.setValueAtTime(f,t0+d);o2.frequency.setValueAtTime(f*2.01,t0+d);g.gain.setValueAtTime(.0001,t0+d);g.gain.linearRampToValueAtTime(.2,t0+d+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.55);o.connect(g);o2.connect(g);g.connect(SG_);o.start(t0+d);o2.start(t0+d);o.stop(t0+d+.6);o2.stop(t0+d+.6)});
 const len=Math.floor(AC.sampleRate*.35),buf=AC.createBuffer(1,len,AC.sampleRate),da=buf.getChannelData(0);for(let i=0;i<len;i++)da[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
 const ns=AC.createBufferSource(),bp=AC.createBiquadFilter(),ng=AC.createGain();ns.buffer=buf;bp.type='bandpass';bp.Q.value=6;bp.frequency.setValueAtTime(1200,t0);bp.frequency.exponentialRampToValueAtTime(7000,t0+.3);ng.gain.value=.09;ns.connect(bp);bp.connect(ng);ng.connect(SG_);ns.start(t0)}catch(x){}}

// ===== v11: layout, perf, keyboard scale =====
function layoutTop(){const t=$('top');if(!t||!t.getBoundingClientRect)return;const rc=t.getBoundingClientRect(),b=FL.on?(FL.dir>0?innerWidth-rc.left:rc.right):rc.bottom;if(b)document.documentElement.style.setProperty('--topH',Math.ceil(b)+'px')}
if(window.ResizeObserver){try{new ResizeObserver(layoutTop).observe($('top'))}catch(x){}}
addEventListener('resize',layoutTop);addEventListener('resize',()=>setTimeout(applyOri,120));addEventListener('orientationchange',()=>setTimeout(applyOri,300));setTimeout(applyOri,400);addEventListener('orientationchange',()=>setTimeout(layoutTop,250));setTimeout(layoutTop,300);setTimeout(layoutTop,1200);
function applyKbs(){document.documentElement.style.setProperty('--kks',sv.kbs||1);const k=$('kb');if(k&&!k.hidden)document.documentElement.style.setProperty('--kbh',(k.offsetHeight||150)+'px')}
window.applyKbs=applyKbs;applyKbs();
let fpsE=.016,lastDown=0;
function perfMon(rdt){if(!(rdt>0)||rdt>.5)return;fpsE=fpsE*.96+rdt*.04;if(tt>5&&tt-lastDown>8&&fpsE>.034){const q=sv.gfx||'high';if(q!='low'){sv.gfx=q=='high'?'med':'low';save();gfx();lastDown=tt;fpsE=.016;toast('⚙ '+t('gfx')+': '+t(sv.gfx))}}}
addEventListener('blur',()=>{for(const k in keys)keys[k]=0});

ui();
rebuildPets();openHome();$('clt').classList.add('pulse');
