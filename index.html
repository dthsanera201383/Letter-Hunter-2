let AC=null,MG=null,SG_=null,MUS=null,musicMode='lobby',musOn=false,musTimer=null,nextT=0,stepI=0;
function ensureAudio(){try{if(!AC){const AX=window.AudioContext||window.webkitAudioContext;if(!AX)return null;AC=new AX();const cp=AC.createDynamicsCompressor();cp.threshold.value=-14;cp.ratio.value=4;cp.connect(AC.destination);MG=AC.createGain();MG.connect(cp);SG_=AC.createGain();SG_.connect(MG);MUS=AC.createGain();MUS.connect(MG);applyVol()}if(AC.state!='running')AC.resume()}catch(x){return null}return AC}
function applyVol(){if(!AC)return;SG_.gain.value=sv.snd?(sv.vol==null?.7:sv.vol)*1.2:0;MUS.gain.value=sv.mus!==false?(sv.mvol==null?.5:sv.mvol)*.55:0}
window.applyVol=applyVol;
function sfx(k){if(!sv.snd||sv.vol===0)return;if(!ensureAudio())return;try{const A_=[[660,880],[300,220],[520],[523,659,784,1047],[523,659,784,1047,784,1047,1319,1568],[392,370,349,330,262,196],[880,880,698,880,698,523,0,466,440,415,392]][k]||[520],gp=k==6?.14:k>=4?.16:.09,t0=AC.currentTime+.03,saw=k==5||k==6;A_.forEach((f,i)=>{if(!f)return;const o=AC.createOscillator(),g=AC.createGain(),s=t0+i*gp,d=k>=4?.34:.2;o.type=saw?'sawtooth':'triangle';o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(.0001,s);g.gain.linearRampToValueAtTime(saw?.12:.2,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(SG_);o.start(s);o.stop(s+d+.02)})}catch(x){}}
const CHT=[[0,4,7],[0,3,7],[0,4,7],[0,4,7]],ROOT=[0,9,5,7],PENT=[0,2,4,7,9,12,14,16],mf=n=>261.63*Math.pow(2,n/12);
function mnote(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MUS);o.start(t);o.stop(t+d+.05)}
function musicTick(){if(!AC||!musOn||AC.state!='running')return;const mm=musicMode=='match',sp=60/(mm?84:104)/2,vol=mm?.6:1;
 while(nextT<AC.currentTime+.35){const bar=Math.floor(stepI/8)%4,beat=stepI%8,r=ROOT[bar],ch=CHT[bar],t0=nextT;
  if(beat==0)ch.forEach(x=>mnote(mf(r+x),t0,sp*7.5,'sine',.06*vol));
  if(beat==0||beat==4)mnote(mf(r-12),t0,sp*1.9,'triangle',.13*vol);
  const ai=[0,1,2,1,2,1,2,1][beat];mnote(mf(r+[0,ch[1],ch[2],12][ai==0?0:ai==1?1:2]+12),t0,sp*1.3,'triangle',.045*vol);
  if(!mm&&beat%2==0&&Math.random()<.5)mnote(mf(PENT[Math.floor(Math.random()*PENT.length)]+(r>5?0:12)),t0,sp*1.7,'sine',.055);
  nextT+=sp;stepI++}}
function musicStart(){if(!ensureAudio())return;musOn=true;nextT=AC.currentTime+.15;stepI=0;if(!musTimer)musTimer=setInterval(musicTick,120)}
function setMusicMode(m){musicMode=m}
['pointerdown','touchend','keydown'].forEach(ev=>addEventListener(ev,()=>{ensureAudio()},{passive:true}));
